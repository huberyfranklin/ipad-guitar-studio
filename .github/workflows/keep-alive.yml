name: Keep Supabase Alive

on:
  schedule:
    # 每天 UTC 04:00 (台灣時間中午 12:00) 定時觸發一次，確保專案活躍不被暫停
    - cron: '0 4 */3 * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊 "Run workflow" 測試

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Sending query to Supabase grades table..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/grades?select=id,title&limit=1")
          
          echo "HTTP Status: $HTTP_STATUS"
          cat response.json
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully pinged Supabase! Project remains active."
          else
            echo "Failed to ping Supabase with status $HTTP_STATUS"
            exit 1
          fi
